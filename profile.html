<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#f3f1ec">
<meta name="description" content="">
<title>What your enquiries are worth</title><style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f3f1ec; --bg2:#e8e4dc; --ink:#16130f; --soft:#615a51; --faint:#9c948a;
  --rust:#b0472e; --rust-lt:#c65a3c; --line:#ded8cf; --card:#fffefc; --dark:#161310;
  --ok:#7fae8a; --out:cubic-bezier(.22,1,.36,1);
}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:linear-gradient(180deg,#fbfaf7 0%,var(--bg) 30%,var(--bg2) 100%);
background-attachment:fixed;color:var(--ink);overflow-x:hidden;

font:17px/1.7 'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
letter-spacing:-.003em;
-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
font-variant-numeric:oldstyle-nums proportional-nums}

.leak b,.tally b,.stat b,.headline b,.bignum b,.sc-leak b,td,.msg,.mono,input,select
{font-variant-numeric:lining-nums tabular-nums}
::selection{background:rgba(176,71,46,.16)}
a{color:inherit;text-decoration:none}
.wrap{max-width:1060px;margin:0 auto;padding:0 22px}
.wrap.tight{max-width:940px}


header{position:sticky;top:0;z-index:40;background:rgba(250,249,246,.86);
backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);
border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:14px;
padding-top:15px;padding-bottom:15px}
.brand{font:700 20px/1 Georgia,'Times New Roman',serif;letter-spacing:.14em;flex:0 0 auto}
.brand span{color:var(--rust)}
.hnav{display:flex;gap:2px;align-items:center;overflow-x:auto;
scrollbar-width:none;-ms-overflow-style:none}
.hnav::-webkit-scrollbar{display:none}
.hnav a{flex:0 0 auto;font-size:14.5px;color:var(--soft);padding:8px 13px;
border-radius:7px;transition:.25s var(--out)}
.hnav a:hover,.hnav a.on{background:rgba(176,71,46,.1);color:var(--ink)}
.hnav a.on{font-weight:600}


.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;
background:var(--ink);color:var(--bg);padding:15px 28px;border-radius:10px;
font:600 11.5px/1 ui-sans-serif,-apple-system,sans-serif;letter-spacing:.14em;
text-transform:uppercase;border:1px solid var(--ink);cursor:pointer;
box-shadow:0 1px 0 rgba(255,255,255,.14) inset,0 10px 26px rgba(22,19,16,.16);
transition:transform .35s var(--out),box-shadow .35s var(--out),background .3s}
.btn:hover{transform:translateY(-1px);background:#221d18;
box-shadow:0 1px 0 rgba(255,255,255,.16) inset,0 16px 34px rgba(22,19,16,.22)}
.btn:active{transform:translateY(0)}
.btn.sm{padding:11px 18px;font-size:10.5px}
.btn.wide{width:100%}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line);box-shadow:none}
.btn.ghost:hover{background:none;border-color:var(--ink)}

.btn.accent{background:var(--rust);border-color:var(--rust);color:#fff;
box-shadow:0 10px 26px rgba(176,71,46,.24)}
.btn.accent:hover{background:#9d3f29;border-color:#9d3f29}
.cta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:36px}


.badge{display:inline-flex;align-items:center;gap:14px;font:600 10.5px/1 ui-sans-serif,
-apple-system,sans-serif;letter-spacing:.26em;color:var(--rust);text-transform:uppercase;
border:0;background:none;padding:0;margin-bottom:30px}
.badge:before,.badge:after{content:"";width:34px;height:1px;background:rgba(176,71,46,.4)}
.eyebrow{font:600 10.5px/1 ui-sans-serif,-apple-system,sans-serif;letter-spacing:.28em;
color:var(--rust);text-transform:uppercase;margin-bottom:22px}

h1{font:400 clamp(38px,7vw,74px)/1.02 'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
letter-spacing:-.028em;text-wrap:balance}
h1 i{font-style:italic;color:var(--rust)}
h2{font:400 clamp(28px,4.8vw,44px)/1.07 'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
letter-spacing:-.022em;margin:0 0 8px;text-wrap:balance}
h2 i{font-style:italic;color:var(--rust)}
h2.mid{text-align:center}
h3{font:400 23px Georgia,serif}
.lede{color:var(--soft);font-size:18.5px;max-width:33em;margin:24px auto 0;line-height:1.62;
text-wrap:pretty}
.sub{color:var(--soft);font-size:16px;margin:0 0 24px}
.sub.mid{text-align:center;max-width:32em;margin:16px auto 30px}
.micro{font-size:13px;color:var(--faint);margin-top:18px}
.hero{text-align:center;padding:70px 0 36px}
section{padding:66px 0}
.mono{font-family:'SF Mono',ui-monospace,SFMono-Regular,Menlo,monospace}


.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);
border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:44px 0}
.stat{background:var(--card);padding:22px 16px;text-align:center}
.stat b{display:block;font:400 30px/1 Georgia,serif;color:var(--rust)}
.stat span{display:block;font-size:10.5px;letter-spacing:.14em;color:var(--faint);margin-top:9px}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:36px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;
display:block;transition:transform .3s var(--out),box-shadow .3s,border-color .3s}
.tile:hover{transform:translateY(-3px);box-shadow:0 16px 38px rgba(26,22,17,.09);
border-color:var(--rust-lt)}
.tile b{display:block;font:400 24px/1.1 Georgia,serif;margin-bottom:8px}
.tile p{font-size:14px;color:var(--soft);line-height:1.55}
.tile em{font-style:normal;color:var(--rust);font-size:11.5px;letter-spacing:.14em;
font-weight:700;display:block;margin-top:16px}

.split{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:44px}
.col{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px}
.col.win{border-color:var(--rust);box-shadow:0 18px 44px rgba(176,71,46,.13)}
.col h3{margin-bottom:6px}
.col .tag{font-size:10.5px;letter-spacing:.18em;font-weight:700;margin-bottom:16px;display:block}
.col.lose .tag{color:var(--faint)} .col.win .tag{color:var(--rust)}
.col li{list-style:none;font-size:14.5px;color:var(--soft);padding:9px 0 9px 26px;
position:relative;line-height:1.55}
.col li:before{position:absolute;left:0;top:8px;font-size:13px}
.col.lose li:before{content:"—";color:var(--faint)}
.col.win li:before{content:"✓";color:var(--rust);font-weight:700}

.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:44px;counter-reset:s}
.stp{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;
counter-increment:s}
.stp:before{content:counter(s);display:flex;align-items:center;justify-content:center;
width:36px;height:36px;border-radius:100px;background:var(--rust);color:#fff;
font-weight:700;margin-bottom:16px}
.stp b{display:block;font:400 21px Georgia,serif;margin-bottom:7px}
.stp p{font-size:14.5px;color:var(--soft);line-height:1.6}

.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:44px;align-items:start}
.tier{background:var(--card);border:1px solid var(--line);border-radius:18px;
padding:30px 26px;position:relative}
.tier.best{border-color:var(--rust);box-shadow:0 22px 54px rgba(176,71,46,.16)}
.tier .flag{position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:var(--rust);
color:#fff;font:600 9.5px/1 ui-sans-serif,-apple-system,sans-serif;letter-spacing:.18em;
text-transform:uppercase;padding:8px 15px;border-radius:6px;white-space:nowrap}
.tier h3{font-size:25px;margin-bottom:4px}
.tier .who{font-size:12.5px;color:var(--faint);margin-bottom:18px}
.tier .price{font:400 52px/1 Georgia,serif;color:var(--rust)}
.tier .price sub{font-size:14px;color:var(--faint);vertical-align:baseline;font-family:inherit}
.tier ul{margin:22px 0;list-style:none}
.tier li{font-size:14px;color:var(--soft);padding:8px 0 8px 24px;position:relative;line-height:1.5}
.tier li:before{content:"✓";position:absolute;left:0;color:var(--rust);font-weight:700;
font-size:12px;top:9px}

.tier li.no{color:var(--faint)}
.tier li.no:before{content:"—";color:var(--faint);font-weight:400}
.tiers{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}

.faq{max-width:760px;margin:44px auto 0}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;
padding:20px 24px;margin-bottom:12px}
details[open]{border-color:var(--rust)}
summary{font-size:16.5px;font-weight:600;cursor:pointer;list-style:none;display:flex;
justify-content:space-between;gap:14px;align-items:center}
summary::-webkit-details-marker{display:none}
summary:after{content:"+";color:var(--rust);font-size:22px;font-weight:400;line-height:1}
details[open] summary:after{content:"–"}
details p{font-size:15px;color:var(--soft);margin-top:14px;line-height:1.65}

.final{background:var(--dark);border-radius:20px;padding:60px 34px;text-align:center;
color:#f2ebdf;margin:20px 0 0}
.final h2{color:#f2ebdf}
.final h2 i{color:#e08b6e}
.final .sub{color:#a89b8a}

.final .btn:not(.accent):not(.ghost){background:#f2ebdf;border-color:#f2ebdf;color:#16130f;
box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 12px 30px rgba(0,0,0,.34)}
.final .btn:not(.accent):not(.ghost):hover{background:#fff;border-color:#fff}
.final .btn.ghost{color:#f2ebdf;border-color:rgba(242,235,223,.34)}
.final .btn.ghost:hover{background:rgba(242,235,223,.08);border-color:#f2ebdf}
.final .micro{color:#8a8177}



.sc-funnel{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;
background:rgba(244,239,230,.14);border-radius:12px;overflow:hidden;margin:18px 0}
.sc-funnel div{background:#1b1815;padding:16px 12px;text-align:center}
.sc-funnel b{display:block;font:400 30px/1 Georgia,serif;color:#f2ebdf;
font-variant-numeric:lining-nums tabular-nums}
.sc-funnel span{display:block;font:600 8.5px/1.4 ui-sans-serif,-apple-system,sans-serif;
letter-spacing:.13em;color:#a89b8a;margin-top:8px}

.sc-lines{margin:0 0 14px}
.sc-lines div{display:flex;justify-content:space-between;gap:14px;align-items:baseline;
padding:9px 0;border-bottom:1px solid rgba(244,239,230,.1)}
.sc-lines span{font-size:13.5px;color:#c3b8aa;line-height:1.45}
.sc-lines b{flex:0 0 auto;color:#f2ebdf;font:600 13.5px/1 ui-sans-serif,-apple-system,sans-serif;
font-variant-numeric:lining-nums tabular-nums}


.sc-split{border:1px dashed rgba(244,239,230,.22);border-radius:12px;padding:16px;margin:16px 0 10px}
.sc-split small{display:block;font:600 8.5px/1.5 ui-sans-serif,-apple-system,sans-serif;
letter-spacing:.13em;color:#8a7f72}
.sc-split b{display:block;font:400 26px/1.1 Georgia,serif;color:#c3b8aa;margin:6px 0 2px;
font-variant-numeric:lining-nums tabular-nums}
.sc-split em{font-style:normal;font-size:12.5px;color:#8a7f72}

.sc-verdict{font-size:14.5px;line-height:1.6;color:#e4d9c9;margin:4px 0 14px;
padding:12px 14px;background:rgba(176,71,46,.14);border-radius:10px}
.sc-verdict b{color:#f2ebdf}

.sc-adv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 4px}
.sc-adv label{display:block;font:600 8.5px/1.5 ui-sans-serif,-apple-system,sans-serif;
letter-spacing:.12em;color:#8a7f72;text-transform:uppercase}
.sc-adv input{width:100%;margin-top:6px;background:rgba(0,0,0,.24);
border:1px solid rgba(244,239,230,.16);border-radius:8px;padding:10px 11px;
color:#f2ebdf;font:400 14px/1 inherit}
.sc-adv input::placeholder{color:#7a6f63;font-size:12.5px}

.sc-work{margin-top:8px;border-top:1px solid rgba(244,239,230,.12);padding-top:6px}
.sc-work summary{cursor:pointer;font:600 9.5px/1 ui-sans-serif,-apple-system,sans-serif;
letter-spacing:.14em;color:#c0553a;text-transform:uppercase;padding:12px 0;list-style:none}
.sc-work summary::-webkit-details-marker{display:none}
.sc-work summary:after{content:" ↓"}
.sc-work[open] summary:after{content:" ↑"}
.sc-step{display:flex;gap:13px;padding:12px 0;border-bottom:1px solid rgba(244,239,230,.1)}
.sc-step i{flex:0 0 auto;width:21px;height:21px;border-radius:50%;
border:1px solid rgba(244,239,230,.28);color:#c3b8aa;font:600 10px/20px ui-sans-serif,sans-serif;
text-align:center;font-style:normal}
.sc-step b{display:block;font:600 10px/1 ui-sans-serif,-apple-system,sans-serif;
letter-spacing:.13em;color:#8a7f72;text-transform:uppercase}
.sc-val{display:block;font:400 17px/1.3 Georgia,serif;color:#f2ebdf;margin:6px 0 5px}
.sc-val em{font-style:normal;font-size:13px;color:#8a7f72}
.sc-val u{text-decoration:none;font:600 8px/1 ui-sans-serif,sans-serif;letter-spacing:.12em;
text-transform:uppercase;color:#c0553a;border:1px solid rgba(192,85,58,.4);
border-radius:4px;padding:3px 5px;vertical-align:2px;margin-left:4px}
.sc-step p{font-size:13px;line-height:1.55;color:#a89b8a;margin-top:2px}
.sc-caveat{font-size:12.5px;line-height:1.6;color:#8a7f72;padding-top:12px}
.sc-acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}


.setup{font-size:13px;color:var(--soft);margin:-6px 0 4px}
.tline{font-size:14px;line-height:1.55;color:var(--soft);margin:12px 0 4px}

@media(max-width:660px){
  .sc-funnel{grid-template-columns:1fr;gap:1px}
  .sc-funnel div{display:flex;align-items:baseline;justify-content:space-between;
    text-align:left;padding:13px 15px}
  .sc-funnel b{font-size:23px}
  .sc-funnel span{margin-top:0;text-align:right}
  .sc-adv{grid-template-columns:1fr;gap:9px}
}

.note{background:none;border:0;border-left:2px solid var(--rust);border-radius:0;
padding:4px 0 4px 22px;font-size:15.5px;color:var(--soft);line-height:1.68;margin:26px 0}
.note b{color:var(--ink);font-weight:600}
.note code{background:rgba(22,19,16,.05);border:0;border-radius:4px;padding:3px 7px;
font:13px 'SF Mono',ui-monospace,monospace;overflow-wrap:anywhere;letter-spacing:-.01em}


.hero.compact{padding:26px 0 4px}
.hero.compact h1{font:400 clamp(30px,6vw,50px)/1.05 Georgia,'Times New Roman',serif}
.hero.compact .tally{margin-top:20px}


.bignum{background:var(--card);border:1px solid var(--line);border-radius:18px;
padding:34px 30px;text-align:center;margin:26px 0}
.bignum small{font-size:10.5px;letter-spacing:.2em;color:var(--faint);font-weight:700}
.bignum b{display:block;font:400 clamp(34px,6.5vw,58px)/1 Georgia,serif;color:var(--rust);
margin:14px 0 6px;letter-spacing:-.02em}
.bignum em{font-style:normal;font-size:14px;color:var(--soft);display:block}
.bignum .pt{font-size:12.5px;color:var(--faint);margin-top:12px}

.prov{display:inline-block;font-size:9.5px;letter-spacing:.14em;font-weight:700;
padding:4px 9px;border-radius:5px;vertical-align:2px;margin-left:8px;white-space:nowrap}
.prov.measured{background:rgba(63,138,85,.13);color:#2f6b43;border:1px solid rgba(63,138,85,.3)}
.prov.benchmark{background:rgba(176,71,46,.1);color:#8f3a25;border:1px solid rgba(176,71,46,.28)}
.prov.assumption{background:#f1ede7;color:var(--soft);border:1px solid var(--line)}

.chain{counter-reset:c;margin:26px 0}
.link{counter-increment:c;position:relative;padding-left:56px;margin-bottom:26px}
.link:before{content:counter(c);position:absolute;left:0;top:0;width:38px;height:38px;
border-radius:100px;background:var(--rust);color:#fff;display:flex;align-items:center;
justify-content:center;font-size:16px;font-weight:700}
.link:after{content:"";position:absolute;left:18.5px;top:44px;bottom:-22px;width:1px;
background:var(--line)}
.link:last-child:after{display:none}
.link h4{font:400 19px Georgia,serif;margin-bottom:4px}
.link .val{font-size:22px;font-weight:600;color:var(--rust);letter-spacing:-.01em}
.link .rng{font-size:12.5px;color:var(--faint);margin-left:9px;font-weight:400}
.link p{font-size:14.5px;color:var(--soft);line-height:1.6;margin-top:8px}

.cost{background:var(--card);border:1px solid var(--line);border-radius:16px;
padding:22px 24px;margin-bottom:12px}
.cost .top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
flex-wrap:wrap}
.cost .saw{font-size:16px;font-weight:600;flex:1;min-width:200px;line-height:1.45}
.cost .amt{text-align:right;white-space:nowrap}
.cost .amt b{display:block;font:400 21px/1 Georgia,serif;color:var(--rust)}
.cost .amt span{font-size:10.5px;letter-spacing:.1em;color:var(--faint)}
.cost .why{font-size:14px;color:var(--soft);line-height:1.6;margin-top:12px;
padding-top:12px;border-top:1px solid var(--line)}
.cost .fix{font-size:13.5px;color:#2f6b43;margin-top:10px;font-weight:600}
.cost .fix:before{content:"→ ";opacity:.6}

.skiplist{list-style:none}
.skiplist li{font-size:14px;color:var(--soft);padding:9px 0 9px 24px;position:relative;
line-height:1.55}
.skiplist li:before{content:"—";position:absolute;left:0;color:var(--faint)}

.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:14px;margin:24px 0 8px}
.pick{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:22px 20px;
cursor:pointer;text-align:left;font-family:inherit;transition:.28s var(--out);position:relative}
.pick:hover{border-color:var(--rust-lt);transform:translateY(-2px);
box-shadow:0 14px 34px rgba(26,22,17,.09)}
.pick.on{border-color:var(--rust);background:#fff;
box-shadow:0 18px 44px rgba(176,71,46,.16)}
.pick.on:after{content:"✓";position:absolute;top:16px;right:18px;color:var(--rust);font-weight:700}
.pick b{display:block;font:400 21px/1.2 Georgia,serif;margin-bottom:8px;padding-right:22px}
.pick p{font-size:13.5px;color:var(--soft);line-height:1.55}
.pick em{font-style:normal;display:block;font-size:11px;letter-spacing:.14em;font-weight:700;
color:var(--rust);margin-top:14px}
@media(max-width:820px){.picks{grid-template-columns:1fr}}

.lockwrap{position:relative;margin-top:14px}
.locked{filter:blur(7px);opacity:.55;pointer-events:none;user-select:none}
.lockover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
justify-content:center;text-align:center;padding:24px;
background:linear-gradient(180deg,rgba(22,19,16,0) 0%,rgba(22,19,16,.55) 34%,rgba(22,19,16,.9) 100%);
border-radius:14px}
.lockover b{font:400 25px/1.2 Georgia,serif;color:#f2ebdf;margin-bottom:8px}
.lockover p{font-size:14px;color:#a89b8a;max-width:34em;margin-bottom:18px;line-height:1.6}
.lockover .btn{background:var(--rust);border-color:var(--rust);color:#fff}
.lockover .btn:hover{background:#9d3f29;border-color:#9d3f29}

.gate{background:linear-gradient(165deg,#241d18,#161310);border:1px solid #3a2f27;
border-radius:18px;padding:38px 30px;text-align:center;color:#f2ebdf;margin:26px 0}
.gate-lock{font-size:26px;margin-bottom:12px}
.gate h3{font:400 27px/1.2 Georgia,serif;color:#f2ebdf;margin-bottom:10px}
.gate p{font-size:14.5px;color:#a89b8a;line-height:1.65;max-width:44em;margin:0 auto 16px}
.gate p b{color:#e08b6e}
.gate .btn{margin-top:6px}
.gate .fine{font-size:12.5px;color:#7d7367;margin-top:18px}



.scrim{position:fixed;inset:0;z-index:80;background:rgba(22,19,16,.55);
backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
opacity:0;pointer-events:none;transition:opacity .32s var(--out)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:81;left:50%;top:50%;width:min(760px,calc(100vw - 32px));
max-height:min(86vh,900px);transform:translate(-50%,-46%) scale(.97);opacity:0;
background:var(--bg);border:1px solid var(--line);border-radius:20px;
box-shadow:0 40px 90px rgba(22,19,16,.34);overflow:hidden;pointer-events:none;
display:flex;flex-direction:column;
transition:opacity .32s var(--out),transform .32s var(--out)}
.sheet.on{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}

<script src="audit.js"></script><script>
(function(){
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;')
    .replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function qs(k){ return new URLSearchParams(location.search).get(k); }
  function slug(s){ return (s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-')
    .replace(/-+/g,'-').replace(/^-|-$/g,'').slice(0,60); }

  var want=qs('b')||'', rec=null;
  if(want) rec=LEADS.filter(function(l){ return slug(l.n)===want; })[0]||null;
  if(!rec && qs('n')) rec=LEADS.filter(function(l){
    return l.n.toLowerCase()===qs('n').toLowerCase(); })[0]||null;

  var name=document.getElementById('pf-name'), meta=document.getElementById('pf-meta'),
      eyebrow=document.getElementById('pf-eyebrow'), out=document.getElementById('pf-out');

  if(!rec){
    eyebrow.textContent='NOT FOUND';

  name.innerHTML=esc(rec.n)+' is leaving<br><i>money on the table.</i>';
  meta.textContent=[rec.q,rec.c,(rec.r?rec.r+'★':''),(rec.v?rec.v+' reviews':'')]
    .filter(Boolean).join(' · ');

  var h=[];

  h.push('<div class="bignum"><small>WHAT THE WEBSITE IS COSTING</small>'+
    '<b>'+usd(b.low)+' – '+usd(b.high)+'</b>'+
    '<em>a month · '+usd(b.low*12)+' – '+usd(b.high*12)+' a year</em>'+
    '<div class="pt">Middle of that range is '+usd(b.monthly)+' a month. '+
    'It is a range because two of the three inputs are estimates — tell me the real '+
    'numbers and it narrows to one.</div></div>');

  h.push('<h2>How that number <i>is built.</i></h2>'+
    '<p class="sub">Three steps. Every figure below is tagged with where it came from.</p>'+
    '<div class="chain">');
  b.steps.forEach(function(s){
    h.push('<div class="link"><h4>'+esc(s.label)+
      '<span class="prov '+s.src+'">'+s.src.toUpperCase()+'</span></h4>'+
      '<div class="val">'+esc(s.value)+'<span class="rng">range '+esc(s.range)+'</span></div>'+
      '<p>'+esc(s.why)+'</p></div>');
  });
  h.push('</div>');

  h.push('<h2>What we found, <i>and what each one costs.</i></h2>'+
    '<p class="sub">Every line here was checked on the live site. You can verify any of them '+
    'in about ten seconds.</p>');

  function costCard(i){
    return '<div class="cost"><div class="top">'+
      '<div class="saw">'+esc(i.saw)+'<span class="prov measured">MEASURED</span></div>'+
      '<div class="amt"><b>'+usd(i.lo)+'–'+usd(i.hi)+'</b><span>PER MONTH</span></div></div>'+
      '<div class="why">'+esc(i.mechanic||i.why)+'</div>'+
      '<div class="why" style="color:var(--faint);font-size:12.5px">'+esc(i.evidence||'')+'</div>'+
      (i.fix?'<div class="fix">'+esc(i.fix)+'</div>':'')+'</div>';
  }

  var free=b.items.slice(0,1), rest=b.items.slice(1);
  free.forEach(function(i){ h.push(costCard(i)); });
  out.innerHTML=h.join('');

  function paidHtml(){
    var g=[];
    if(rest.length){
      rest.forEach(function(i){ g.push(costCard(i)); });
    }
    if(b.capped){
      g.push('<div class="note"><b>Held down on purpose.</b> Added up raw, these overlap — '+
        'the same lost customer gets counted twice by two different problems. The total is '+
        'capped at '+b.share_pct+'% of business the site touches, so the number you see is '+
        'lower than the parts.</div>');
    }
    if(b.not_counted.length){
      g.push('<h2>What we <i>did not</i> count.</h2>'+
        '<p class="sub">These are real problems on the site. They are worth money and none of '+
        'them are in the figure above.</p><ul class="skiplist">');
      b.not_counted.forEach(function(n){ g.push('<li>'+esc(n.why)+'</li>'); });
      g.push('</ul>');
    }
    g.push('<h2>Argue with <i>the maths.</i></h2>'+
      '<p class="sub">The estimate moves with your real numbers. Here is how much.</p><table>');
    b.sensitivity.forEach(function(s){
      g.push('<tr><td>If '+esc(s.i)+'</td><td>'+usd(s.t)+' a month</td></tr>');
    });
    g.push('</table>');

    g.push('<h2>What to fix, <i>in order.</i></h2>'+
      '<p class="sub">Ranked by what each one is costing. Hand this to whoever builds your '+
      'site — us or anyone else.</p><table>');
    b.items.forEach(function(i,n){
      g.push('<tr><td><b>'+(n+1)+'. '+esc(i.fix||i.saw)+'</b></td><td>Worth about '+
        usd(i.mid)+' a month'+(i.customers?' · roughly '+i.customers+' customers':'')+'</td></tr>');
    });
    g.push('</table>');

    g.push('<div class="note"><b>This is an estimate from public data, not your books.</b> '+
      'Customer volume and average ticket are the two numbers we had to assume, and they are '+
      'the two you know exactly. Tell me both and this becomes one number instead of a range — '+
      'and if it comes out lower than this, that is the honest answer.</div>');
    return g.join('');
  }

  function gateHtml(){
    var hidden=rest.length+(b.not_counted?b.not_counted.length:0);
    var worth=rest.reduce(function(a,i){return a+i.mid;},0);
    var pay=CFG.pay||('mailto:'+CFG.contact+'?subject='+encodeURIComponent('Full report — '+rec.n));
    return '<div class="gate">'+
      '<div class="gate-lock">🔒</div>'+
      '<h3>'+(hidden?hidden+' more problems found on your site':'The full breakdown')+'</h3>'+
      (worth?'<p>Worth about <b>'+usd(worth)+' a month</b> on top of the one above.</p>':'')+
      '<p>The full report itemises every one of them, shows what each is costing, what it '+
      'takes to fix, and the order to do it in — plus how the estimate moves against your '+
      'real numbers.</p>'+
      '<a class="btn" href="'+esc(pay)+'" target="_blank">Unlock the full report — $'+
      esc(CFG.price)+'</a>'+
      '<p class="fine">One payment, this report, yours to keep and to hand to any developer. '+
      'If you would rather just talk it through, reply to the message that brought you here '+
      'and I will walk you through the whole thing for nothing.</p></div>';
  }

  function tail(){
    var h='';
    if(rec.u){
      h+='<h2>The <i>fix</i> already exists.</h2>'+
        '<p class="sub">A replacement homepage, built from your own listing — your photos, '+
        'your hours, your rating. Nothing invented, nothing owed.</p>'+
        '<div class="cta"><a class="btn" href="'+esc(rec.u)+'" target="_blank">'+
        'See your new site →</a></div>';
    }
    var hasSite=!!rec.d, has=function(c){ return rec.k.indexOf(c)>=0; };
    var opts=[];
    if(has('NO_BOOKING')) opts.push(['booking','Just sort the booking',
      'One booking link people can use at 9pm on a Sunday, wired into however you '+
      'already run the diary. Nothing else touched.',
      'SMALLEST JOB · BIGGEST SINGLE LINE ABOVE']);
    if(has('NO_SCHEMA')||has('NO_DESC')||has('THIN_TITLE')||has('JS_RENDERED'))
      opts.push(['found','Just get me found',
      'The listing, the search snippet and the data Google reads, so you turn up '+
      'properly when someone searches your street.',
      'NO SITE WORK NEEDED']);
    opts.push(['answer','Answer the ones I miss',
      'A bot on the site you already have that answers questions in your words, day or '+
      'night, and takes a name and a number before they go. Nothing else changes.',
      'MOST POPULAR']);
    opts.push(['book','Answer them and book them in',
      'The same thing, and then it puts them in the diary while they are still interested '+
      '— plus Instagram and Facebook messages, and a nudge the day before.',
      'FILLS THE DIARY']);
    if(hasSite) opts.push(['reinvention','My site is the problem',
      'For the enquiries that die before anything could answer them — the page will not '+
      'load on a phone, or the link on Google is broken. Keep the domain, rebuild what is '+
      'costing you.',
      'ONLY IF THE X-RAY SAYS SO']);
    else opts.push(['simple','I have nowhere to put it',
      'One page that loads fast and says who you are, what you do and how to book — '+
      'with the bot already on it.',
      'QUICKEST TO LIVE']);
    opts.push(['talk','I just want to talk it through',
      'No commitment, no quote. Fifteen minutes on the phone and I will tell you '+
      'straight whether it is worth spending anything at all.',
      'FREE']);

    h+='<h2 style="margin-top:44px">What would you <i>actually want?</i></h2>'+
      '<p class="sub">Pick whichever is closest. Nothing is committed and there\'s no '+
      'charge for asking — it just tells me which conversation to have.</p><div class="picks">';
    opts.forEach(function(o){
      h+='<button class="pick" type="button" data-k="'+o[0]+'" data-label="'+esc(o[1])+'">'+
         '<b>'+esc(o[1])+'</b><p>'+esc(o[2])+'</p><em>'+o[3]+'</em></button>';
    });
    h+='</div><div class="cta" style="margin-top:22px">'+
       '<a class="btn" id="pick-go" href="'+esc(mailUrl(''))+'">Pick one to continue →</a></div>'+
       '<p class="micro" style="text-align:center">Goes straight to '+esc(CFG.builder)+
       '. Usually a reply the same day.</p>';
    return h;
  }

  function mailUrl(choice){
    var subj=choice? choice+' — '+rec.n : 'My website — '+rec.n;
    var body='I read the report for '+rec.n+'.\n\n'+
      (choice?'What I want: '+choice+'\n\n':'')+
      'My actual numbers, if it helps:\n'+
      '  jobs a month: \n  average spend a job: \n\n'+
      'Best way to reach me: \n';
    return 'mailto:'+CFG.contact+'?subject='+encodeURIComponent(subj+' ['+rec.g+']')+
           '&body='+encodeURIComponent(body);
  }

  document.addEventListener('click',function(ev){
    var b=ev.target.closest('.pick'); if(!b) return;
    document.querySelectorAll('.pick').forEach(function(x){x.classList.toggle('on',x===b)});
    var go=document.getElementById('pick-go');
    if(go){ go.href=mailUrl(b.dataset.label); go.textContent='Send this to '+CFG.builder+' →'; }
  });

  function sha256(str){
    if(!(window.crypto&&crypto.subtle)) return Promise.resolve('');
    return crypto.subtle.digest('SHA-256',new TextEncoder().encode(str))
      .then(function(buf){
        return Array.prototype.map.call(new Uint8Array(buf),function(x){
          return ('0'+x.toString(16)).slice(-2); }).join('');
      });
  }

  var key=qs('k')||'';
  (key?sha256(key):Promise.resolve('')).then(function(dig){
    var unlocked=!!(dig&&rec.x&&dig===rec.x);
    out.innerHTML=h.join('')+(unlocked?paidHtml():gateHtml())+tail();
    if(unlocked){
      var badge=document.createElement('div');
      badge.className='note';
      badge.innerHTML='<b>Full report unlocked.</b> Bookmark this link — it stays live.';
      out.insertBefore(badge,out.firstChild);
    }
  });
})();
</script><script>
(function(){
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(reduce||!('IntersectionObserver' in window)) return;

  function revealAll(){
    document.querySelectorAll('.rv,.rv-stagger').forEach(function(el){
      el.classList.add('in');
    });
  }

  if(document.visibilityState!=='visible'){
    document.addEventListener('visibilitychange',function once(){
      if(document.visibilityState==='visible'){
        document.removeEventListener('visibilitychange',once); start();
      }
    });
    return;
  }
  start();

  function start(){
  document.documentElement.classList.add('anim');

  var net=setTimeout(revealAll,2200);

  var io=new IntersectionObserver(function(es){
    es.forEach(function(e){
      if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }
    });
  },{threshold:0,rootMargin:'0px 0px -6% 0px'});

  function mark(){
    document.querySelectorAll('.rv:not(.in),.rv-stagger:not(.in)').forEach(function(el){
      io.observe(el);
    });
  }
  mark();
  document.addEventListener('click',function(){ setTimeout(mark,30); });
  window.addEventListener('pagehide',function(){ clearTimeout(net); });

  requestAnimationFrame(function(){
    document.querySelectorAll('.rv,.rv-stagger').forEach(function(el){
      var r=el.getBoundingClientRect();
      if(r.top<innerHeight*0.94) el.classList.add('in');
    });
  });

  var sc=document.querySelector('.scanner.tilt');
  if(sc&&matchMedia('(hover:hover) and (pointer:fine)').matches){
    var raf=null;
    sc.addEventListener('pointermove',function(ev){
      if(raf) return;
      raf=requestAnimationFrame(function(){
        raf=null;
        var r=sc.getBoundingClientRect();
        var px=(ev.clientX-r.left)/r.width-.5, py=(ev.clientY-r.top)/r.height-.5;
        sc.style.setProperty('--ry',(px*5).toFixed(2)+'deg');
        sc.style.setProperty('--rx',(-py*4).toFixed(2)+'deg');
      });
    });
    sc.addEventListener('pointerenter',function(){ sc.classList.add('lift'); });
    sc.addEventListener('pointerleave',function(){
      sc.classList.remove('lift');
      sc.style.setProperty('--ry','0deg'); sc.style.setProperty('--rx','0deg');
    });
  }
  }
})();
</script><script>
(function(){
  if(!('IntersectionObserver' in window)) return;
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;

  var ticking=false;
  function onScroll(){
    if(ticking) return;
    ticking=true;
    requestAnimationFrame(function(){
      ticking=false;
      document.documentElement.classList.toggle('scrolled',(window.scrollY||0)>12);
      if(!reduce) parallax();
    });
  }

  var pxEls=[];
  function parallax(){
    var h=window.innerHeight||1;
    for(var i=0;i<pxEls.length;i++){
      var el=pxEls[i], r=el.getBoundingClientRect();
      if(r.bottom<-200||r.top>h+200) continue;
      var mid=r.top+r.height/2, off=(mid-h/2)/h;
      var amt=parseFloat(el.getAttribute('data-px')||'12');
      el.style.transform='translate3d(0,'+(-off*amt).toFixed(2)+'px,0)';
    }
  }

  if(reduce){
    window.addEventListener('scroll',onScroll,{passive:true});
    onScroll();
    return;                      // everything below is purely decorative
  }

  function splitWords(el){
    if(el.dataset.split) return;
    el.dataset.split='1';
    var out='';
    el.textContent.split(/(\s+)/).forEach(function(tok){
      out += /^\s+$/.test(tok) ? tok : '<span class="w">'+tok+'</span>';
    });
    el.innerHTML=out;
  }
  function splitChars(el){
    if(el.dataset.split) return;
    el.dataset.split='1';
    var out='';
    el.textContent.split('').forEach(function(ch){
      out += ch===' ' ? ' ' : '<span class="c">'+ch.replace(/</g,'&lt;')+'</span>';
    });
    el.innerHTML=out;
  }
  document.querySelectorAll('.rv-words').forEach(splitWords);
  document.querySelectorAll('.rv-read').forEach(splitChars);

  document.querySelectorAll('.rv-words').forEach(function(el){
    el.querySelectorAll('.w').forEach(function(w,i){
      w.style.transitionDelay=(i*0.055).toFixed(3)+'s';
    });
  });

  var SEL='.rv-mask,.rv-blur,.rv-line,.rv-words';
  var io=new IntersectionObserver(function(es){
    es.forEach(function(e){
      if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }
    });
  },{threshold:0,rootMargin:'0px 0px -8% 0px'});
  function mark(){ document.querySelectorAll(SEL+':not(.in)').forEach(function(el){ io.observe(el); }); }
  mark();
  document.addEventListener('click',function(){ setTimeout(mark,30); });

  setTimeout(function(){
    document.querySelectorAll(SEL).forEach(function(el){ el.classList.add('in'); });
  },2400);
  requestAnimationFrame(function(){
    document.querySelectorAll(SEL).forEach(function(el){
      if(el.getBoundingClientRect().top<innerHeight*0.94) el.classList.add('in');
    });
  });

  var readEls=[].slice.call(document.querySelectorAll('.rv-read'));
  function readTick(){
    var h=window.innerHeight||1;
    readEls.forEach(function(el){
      var r=el.getBoundingClientRect();
      if(r.bottom<0||r.top>h) return;
      var p=(h*0.8-r.top)/(r.height+h*0.6);
      var cs=el.querySelectorAll('.c'), n=cs.length;
      var lit=Math.round(Math.max(0,Math.min(1,p))*n);
      for(var i=0;i<n;i++) cs[i].classList.toggle('lit',i<lit);
    });
  }

  pxEls=[].slice.call(document.querySelectorAll('.px'));
  var rafPending=false;
  window.addEventListener('scroll',function(){
    onScroll();
    if(rafPending) return;
    rafPending=true;
    requestAnimationFrame(function(){ rafPending=false; readTick(); });
  },{passive:true});
  window.addEventListener('resize',function(){ parallax(); readTick(); },{passive:true});
  onScroll(); readTick();

  if(matchMedia('(hover:hover) and (pointer:fine)').matches){
    document.querySelectorAll('.mag').forEach(function(el){
      var raf=null;
      el.addEventListener('pointermove',function(ev){
        if(raf) return;
        raf=requestAnimationFrame(function(){
          raf=null;
          var r=el.getBoundingClientRect();
          var x=(ev.clientX-r.left-r.width/2)*0.18;
          var y=(ev.clientY-r.top-r.height/2)*0.28;
          el.style.transform='translate('+x.toFixed(1)+'px,'+y.toFixed(1)+'px)';
        });
      });
      el.addEventListener('pointerleave',function(){ el.style.transform=''; });
    });
  }
})();
</script></body></html>
